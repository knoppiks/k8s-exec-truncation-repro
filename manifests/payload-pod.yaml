apiVersion: v1
kind: Namespace
metadata:
  name: exec-repro
  labels:
    app.kubernetes.io/name: k8s-exec-truncation-repro
---
apiVersion: v1
kind: Pod
metadata:
  name: payload
  namespace: exec-repro
  labels:
    app.kubernetes.io/name: k8s-exec-truncation-repro
spec:
  # No volumes, no PVCs, no CSI: the payload is generated from /dev/zero so
  # that nothing but the exec stream itself is under test.
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: payload
      image: alpine:3.22
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: "2"
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
